<!DOCTYPE html>
<html>

<head>
    <title>Product Catalog</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container">

    <h1 class="text-center mt-3">
        Online Product Catalog
    </h1>

    <!-- Product List -->
    <h3>Products</h3>

    <ul>
        <li>Laptop</li>
        <li>Mobile</li>
        <li>Headphone</li>
    </ul>

    <!-- Product Table -->
    <table class="table table-bordered">

        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Image</th>
        </tr>

        <tr>
            <td>Laptop</td>
            <td>₹50,000</td>
            <td>
                <img src="laptop.jpg"
                     width="100">
            </td>
        </tr>

        <tr>
            <td>Mobile</td>
            <td>₹20,000</td>
            <td>
                <img src="mobile.jpg"
                     width="100">
            </td>
        </tr>

        <tr>
            <td>Headphone</td>
            <td>₹2,000</td>
            <td>
                <img src="headphone.jpg"
                     width="100">
            </td>
        </tr>

    </table>

    <!-- Video -->
    <h3>Product Video</h3>

    <video width="300" controls>
        <source src="product.mp4" type="video/mp4">
    </video>

    <!-- Audio -->
    <h3>Product Audio</h3>

    <audio controls>
        <source src="product.mp3" type="audio/mpeg">
    </audio>

</div>

</body>
</html>
